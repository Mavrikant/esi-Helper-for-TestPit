name: Continuous Integration

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test on ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Compile
        run: npm run compile
      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          npm run coverage 2>&1 | tee coverage-output.txt
      - name: Post coverage to job summary
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          {
            echo "## Coverage report"
            echo
            echo '```'
            # Skip the mocha output (everything before the c8 table) and
            # keep the file-by-file table c8 prints last.
            awk '/^-+\|/{found=1} found{print}' coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML coverage report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release extension
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-and-test]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Package extension
        run: npx --yes @vscode/vsce package
      - name: Publish to VS Code Marketplace
        if: env.PUBLISH_TOKEN != ''
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: npx --yes @vscode/vsce publish -p "$PUBLISH_TOKEN"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
