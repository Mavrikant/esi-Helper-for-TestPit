name: Continuous Integration

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    # The Node 26 jobs keep their existing check names; only the extra
    # floor job is suffixed.
    name: Build and Test on ${{ matrix.os }}${{ matrix.node != '26' && format(' (Node {0})', matrix.node) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Current Node.js LTS on every OS ...
        node: ['26']
        include:
          # ... plus the engines.node floor (package.json: >=22) on Linux.
          - os: ubuntu-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Compile
        run: npm run compile
      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          npm run coverage 2>&1 | tee coverage-output.txt
      - name: Post coverage to job summary
        if: always() && runner.os == 'Linux' && matrix.node == '26'
        shell: bash
        run: |
          {
            echo "## Coverage report"
            echo
            echo '```'
            # Skip the mocha output (everything before the c8 table) and
            # keep the file-by-file table c8 prints last.
            awk '/^-+\|/{found=1} found{print}' coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML coverage report
        if: always() && runner.os == 'Linux' && matrix.node == '26'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release extension
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-and-test]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Package extension
        run: npx --yes @vscode/vsce package
      - name: Publish to VS Code Marketplace
        if: env.PUBLISH_TOKEN != ''
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: npx --yes @vscode/vsce publish -p "$PUBLISH_TOKEN"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.vsix'
