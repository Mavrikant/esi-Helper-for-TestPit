<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Multimeter body -->
    <rect x="1" y="2" width="9" height="12" rx="0.75"/>
    <!-- Dial: circle with diagonal needle / no-signal slash -->
    <circle cx="5.5" cy="5.5" r="2"/>
    <line x1="4" y1="7" x2="7" y2="4"/>
    <!-- Display strip below the dial -->
    <rect x="2.5" y="9" width="6" height="2.5"/>
    <!-- Two probe leads -->
    <line x1="10" y1="5.5" x2="13" y2="5.5"/>
    <line x1="10" y1="10" x2="13" y2="10"/>
  </g>
  <g fill="currentColor">
    <!-- Probe tips -->
    <rect x="13" y="4.5" width="2" height="2" rx="0.25"/>
    <rect x="13" y="9" width="2" height="2" rx="0.25"/>
  </g>
</svg>
